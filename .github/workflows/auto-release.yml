name: Auto Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    # Skip commits made by this workflow itself (version bumps start with "chore:")
    if: "!startsWith(github.event.head_commit.message, 'chore:')"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: zip
          tools: composer

      - name: Bump version
        id: ver
        run: |
          CURRENT=$(php -r "echo json_decode(file_get_contents('versions.json'))->latest;")
          IFS='.' read -ra P <<< "$CURRENT"
          NEW="${P[0]}.${P[1]}.$((${P[2]}+1))"
          echo "current=$CURRENT" >> $GITHUB_OUTPUT
          echo "new=$NEW"         >> $GITHUB_OUTPUT
          echo "  $CURRENT  ->  $NEW"

      - name: Composer install (production)
        run: composer install --no-dev --optimize-autoloader --no-interaction --no-progress

      - name: Build cPanel ZIP
        run: |
          VERSION="${{ steps.ver.outputs.new }}"
          APP="ryaancms"
          mkdir -p dist/$APP dist/public_html

          rsync -a \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='dist' \
            --exclude='.env' \
            --exclude='*.zip' \
            --exclude='public' \
            --exclude='release.bat' \
            --exclude='build-release.ps1' \
            --exclude='push.ps1' \
            --exclude='setup.ps1' \
            --exclude='.ryaan-config' \
            . dist/$APP/

          cp -r public/. dist/public_html/

          python3 - <<'PY'
import os

APP = 'ryaancms'

# Fix index.php paths for cPanel layout
idx_path = 'dist/public_html/index.php'
idx = open(idx_path).read()
idx = idx.replace("__DIR__ . '/../storage/app/.installed'",            f"__DIR__ . '/../{APP}/storage/app/.installed'")
idx = idx.replace("__DIR__ . '/../storage/framework/maintenance.php'", f"__DIR__ . '/../{APP}/storage/framework/maintenance.php'")
idx = idx.replace("__DIR__.'/../storage/framework/maintenance.php'",   f"__DIR__.'/../{APP}/storage/framework/maintenance.php'")
idx = idx.replace("__DIR__.'/../vendor/autoload.php'",                 f"__DIR__.'/../{APP}/vendor/autoload.php'")
idx = idx.replace("__DIR__.'/../bootstrap/app.php'",                   f"__DIR__.'/../{APP}/bootstrap/app.php'")
open(idx_path, 'w').write(idx)

# Fix install.php: BASE_PATH must point to ryaancms/ not parent of public_html
ins_path = 'dist/public_html/install.php'
if os.path.exists(ins_path):
    ins = open(ins_path).read()
    ins = ins.replace(
        "define('BASE_PATH', dirname(__DIR__));",
        f"define('BASE_PATH', dirname(__DIR__) . '/{APP}');"
    )
    open(ins_path, 'w').write(ins)

print('Paths fixed.')
PY

          # Clean runtime files (keep directory structure)
          for d in dist/$APP/storage/logs \
                   dist/$APP/storage/framework/cache/data \
                   dist/$APP/storage/framework/sessions \
                   dist/$APP/storage/framework/views \
                   dist/$APP/bootstrap/cache; do
            mkdir -p "$d"
            find "$d" -maxdepth 1 -type f ! -name '.gitkeep' -delete 2>/dev/null || true
            touch "$d/.gitkeep"
          done

          cd dist
          zip -r "../ryaancms-v$VERSION-cpanel.zip" . -x '*.git*'
          cd ..

          SIZE=$(du -sh "ryaancms-v$VERSION-cpanel.zip" | cut -f1)
          echo "ZIP: ryaancms-v$VERSION-cpanel.zip  ($SIZE)"

      - name: Update versions.json
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          VERSION="${{ steps.ver.outputs.new }}"
          CURRENT="${{ steps.ver.outputs.current }}"
          REPO="${{ github.repository }}"
          DATE=$(date +%Y-%m-%d)
          URL="https://github.com/$REPO/releases/download/v$VERSION/ryaancms-v$VERSION-cpanel.zip"

          python3 - <<PY
import json, os
with open('versions.json') as f:
    v = json.load(f)
v['versions'].append({
    'version': '$VERSION',
    'type': 'feature',
    'released_at': '$DATE',
    'changelog': os.environ['COMMIT_MSG'],
    'download_url': '$URL',
    'requires_migration': True,
    'min_php': '8.2',
    'min_from_version': '$CURRENT',
    'critical': False,
    'file_count': None,
})
v['latest'] = '$VERSION'
with open('versions.json', 'w') as f:
    json.dump(v, f, indent=4, ensure_ascii=False)
print('versions.json updated  ->  v$VERSION')
PY

      - name: Commit version bump
        run: |
          git config user.name "RyaanCMS Bot"
          git config user.email "bot@ryaancms.com"
          git add versions.json
          git commit -m "chore: bump version to v${{ steps.ver.outputs.new }}"
          git push

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          VERSION="${{ steps.ver.outputs.new }}"

          gh release create "v$VERSION" \
            --title "RyaanCMS v$VERSION" \
            --latest \
            --notes "## RyaanCMS v$VERSION

$COMMIT_MSG

### cPanel Installation
1. Download **ryaancms-v${VERSION}-cpanel.zip** below
2. Upload to \`/home/username/\` via File Manager
3. Extract — place \`public_html/\` contents and \`ryaancms/\` folder correctly
4. \`chmod -R 775 ryaancms/storage ryaancms/bootstrap/cache\`
5. Visit your domain — install wizard starts automatically!" \
            "ryaancms-v$VERSION-cpanel.zip"
