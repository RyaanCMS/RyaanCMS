name: Auto Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    if: "!startsWith(github.event.head_commit.message, 'chore:')"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: zip
          tools: composer

      - name: Bump version
        id: ver
        run: |
          sed -i '1s/^\xEF\xBB\xBF//' versions.json
          CURRENT=$(php -r "echo json_decode(file_get_contents('versions.json'))->latest;")
          IFS='.' read -ra P <<< "$CURRENT"
          NEW="${P[0]}.${P[1]}.$((${P[2]}+1))"
          echo "current=$CURRENT" >> $GITHUB_OUTPUT
          echo "new=$NEW"         >> $GITHUB_OUTPUT
          echo "$CURRENT -> $NEW"

      - name: Composer install (production)
        run: composer install --no-dev --optimize-autoloader --no-interaction --no-progress --no-scripts

      - name: Build cPanel ZIP
        run: |
          VERSION="${{ steps.ver.outputs.new }}"
          APP="ryaancms"
          mkdir -p dist/$APP dist/public_html

          rsync -a \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='dist' \
            --exclude='.env' \
            --exclude='*.zip' \
            --exclude='public' \
            --exclude='release.bat' \
            --exclude='build-release.ps1' \
            --exclude='push.ps1' \
            --exclude='setup.ps1' \
            --exclude='.ryaan-config' \
            . dist/$APP/

          cp -r public/. dist/public_html/

          # Fix index.php paths for cPanel layout (public_html/ + ryaancms/ side by side)
          sed -i "s|__DIR__ . '/../storage/app/.installed'|__DIR__ . '/../${APP}/storage/app/.installed'|g" dist/public_html/index.php
          sed -i "s|__DIR__ . '/../storage/framework/maintenance.php'|__DIR__ . '/../${APP}/storage/framework/maintenance.php'|g" dist/public_html/index.php
          sed -i "s|__DIR__.'/../storage/framework/maintenance.php'|__DIR__.'/../${APP}/storage/framework/maintenance.php'|g" dist/public_html/index.php
          sed -i "s|__DIR__.'/../vendor/autoload.php'|__DIR__.'/../${APP}/vendor/autoload.php'|g" dist/public_html/index.php
          sed -i "s|__DIR__.'/../bootstrap/app.php'|__DIR__.'/../${APP}/bootstrap/app.php'|g" dist/public_html/index.php

          # Fix install.php: BASE_PATH must point inside ryaancms/ folder
          if [ -f dist/public_html/install.php ]; then
            sed -i "s|define('BASE_PATH', dirname(__DIR__));|define('BASE_PATH', dirname(__DIR__) . '/${APP}');|g" dist/public_html/install.php
          fi

          # Clean runtime files
          for d in dist/$APP/storage/logs \
                   dist/$APP/storage/framework/cache/data \
                   dist/$APP/storage/framework/sessions \
                   dist/$APP/storage/framework/views \
                   dist/$APP/bootstrap/cache; do
            mkdir -p "$d"
            find "$d" -maxdepth 1 -type f ! -name '.gitkeep' -delete 2>/dev/null || true
            touch "$d/.gitkeep"
          done

          cd dist
          zip -r "../ryaancms-v${VERSION}-cpanel.zip" . -x '*.git*'
          cd ..
          echo "ZIP: ryaancms-v${VERSION}-cpanel.zip  ($(du -sh ryaancms-v${VERSION}-cpanel.zip | cut -f1))"

      - name: Update versions.json
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          NEW_VERSION: ${{ steps.ver.outputs.new }}
          OLD_VERSION: ${{ steps.ver.outputs.current }}
          REPO: ${{ github.repository }}
        run: |
          node -e "
            const fs = require('fs');
            const v = JSON.parse(fs.readFileSync('versions.json', 'utf8'));
            const ver = process.env.NEW_VERSION;
            const repo = process.env.REPO;
            v.versions.push({
              version: ver,
              type: 'feature',
              released_at: new Date().toISOString().slice(0,10),
              changelog: process.env.COMMIT_MSG,
              download_url: 'https://github.com/' + repo + '/releases/download/v' + ver + '/ryaancms-v' + ver + '-cpanel.zip',
              requires_migration: true,
              min_php: '8.2',
              min_from_version: process.env.OLD_VERSION,
              critical: false,
              file_count: null
            });
            v.latest = ver;
            fs.writeFileSync('versions.json', JSON.stringify(v, null, 4) + '\n');
            console.log('versions.json updated -> v' + ver);
          "

      - name: Commit version bump
        run: |
          git config user.name "RyaanCMS Bot"
          git config user.email "bot@ryaancms.com"
          git add versions.json
          git commit -m "chore: bump version to v${{ steps.ver.outputs.new }}"
          git push

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          VERSION="${{ steps.ver.outputs.new }}"
          printf "## RyaanCMS v%s\n\n%s\n\n### cPanel Installation\n1. Download ryaancms-v%s-cpanel.zip below\n2. Upload to /home/username/ via File Manager\n3. Extract - place public_html/ contents and ryaancms/ folder correctly\n4. chmod -R 775 ryaancms/storage ryaancms/bootstrap/cache\n5. Visit your domain - install wizard starts automatically!" \
            "${VERSION}" "${COMMIT_MSG}" "${VERSION}" > release-notes.md
          gh release create "v${VERSION}" \
            --title "RyaanCMS v${VERSION}" \
            --latest \
            --notes-file release-notes.md \
            "ryaancms-v${VERSION}-cpanel.zip"
