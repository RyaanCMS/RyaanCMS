name: Sync to Public Repo

# Triggers every time you push to private repo's main branch
on:
  push:
    branches: [main]

jobs:
  sync:
    name: Filter & Push to Public
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout private repo (full history NOT needed) ──
      - name: Checkout private repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1  # shallow clone — faster

      # ── 2. Remove all private/central marketplace files ──────
      - name: Strip private files
        run: |
          echo "Removing central marketplace files..."

          rm -rf app/Http/Controllers/Central
          rm -rf app/Services/Commission
          rm -rf app/Services/Payout
          rm -rf routes/marketplace-host.php
          rm -rf database/migrations/central
          rm -rf resources/views/central
          rm -rf config/commission.php

          # Remove repo management scripts
          rm -f push.ps1
          rm -f setup.ps1
          rm -f .ryaan-config
          rm -f .publicignore

          # Remove this workflow file itself (public repo doesn't need it)
          rm -rf .github/workflows/sync-public.yml

          echo "Private files stripped successfully."

      # ── 3. Push clean code to public repo ───────────────────
      - name: Push to public repo
        uses: cpina/github-action-push-to-another-repository@main
        env:
          API_TOKEN_GITHUB: ${{ secrets.PUBLIC_REPO_TOKEN }}
        with:
          source-directory: '.'
          destination-github-username: 'RyaanCMS'
          destination-repository-name: 'RyaanCMS'
          target-branch: main
          commit-message: ${{ github.event.head_commit.message }}
